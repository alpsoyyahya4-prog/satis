<title>Satış</title>
<style>
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#F3F4F7; --surface-3:#E8EAF0;
  --ink:#141827; --ink-2:#4A5066; --muted:#737990; --line:#E7E9EF;
  --accent:#0F766E; --accent-ink:#FFFFFF; --accent-soft:#DDF3EF;
  --up:#C23A2B; --up-soft:#FBE8E5; --down:#13805A; --down-soft:#E0F3EA;
  --warn:#8A5A00; --warn-soft:#F8EDD6;
  --shadow-sm:0 1px 2px rgba(20,24,39,.06);
  --shadow:0 6px 24px rgba(20,24,39,.14);
  --ff:system-ui,-apple-system,Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --fm:system-ui,-apple-system,Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --tabh:64px; --nav-inset:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F17; --surface:#161A25; --surface-2:#1C2130; --surface-3:#262C3D;
    --ink:#E9EBF2; --ink-2:#BAC0D0; --muted:#8A91A7; --line:#242A3A;
    --accent:#5EEAD4; --accent-ink:#062A2F; --accent-soft:#153E42;
    --up:#FF8F7C; --up-soft:#3A201C; --down:#5AD39F; --down-soft:#123024;
    --warn:#E8B64F; --warn-soft:#33280F;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 6px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F17; --surface:#161A25; --surface-2:#1C2130; --surface-3:#262C3D;
  --ink:#E9EBF2; --ink-2:#BAC0D0; --muted:#8A91A7; --line:#242A3A;
  --accent:#9AA9FF; --accent-ink:#0C0F17; --accent-soft:#232A4A;
  --up:#FF8F7C; --up-soft:#3A201C; --down:#5AD39F; --down-soft:#123024;
  --warn:#E8B64F; --warn-soft:#33280F;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--ff);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea,.memo{-webkit-user-select:text;user-select:text}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.amt,.big{font-family:var(--fm);font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabh) + var(--nav-inset) + 100px)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:16px 16px 12px;min-height:60px;display:flex;align-items:center;gap:4px;background:var(--bg);transition:box-shadow .2s}
.top.scrolled{box-shadow:0 1px 0 var(--line)}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.top h1 .logo{flex:none}
.top.detail{padding:10px 6px 10px 4px}
.top .t1{font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.top .t2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.top .tt.swap{animation:fade .25s ease both}

/* search */
/* search stays pinned under the title while the list scrolls */
.search{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,60px));z-index:19;margin:0 -16px 4px;padding:0 16px 10px;background:var(--bg)}
.search > svg{position:absolute;left:30px;top:23px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 46px 0 42px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--accent)}
.search .clr{position:absolute;right:17px;top:1px;width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.hit{color:var(--accent);font-weight:600}

/* lists: two calm lines per row */
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:64px;border-top:1px solid var(--line);text-decoration:none;color:inherit;transition:background-color .15s}
.row:first-child{border-top:0}
a.row:active{background:var(--surface-2)}
@media (hover:hover){a.row:hover{background:var(--surface-2)}}
.row > svg{flex:none;color:var(--muted);opacity:.7}
.main{flex:1;min-width:0}
.name{font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.side{flex:none;text-align:right}
/* prices read like a price tag: bold lira, small softer ₺ and kuruş */
.amt{font-weight:700;font-size:17px;letter-spacing:-.015em;white-space:nowrap}
.amt .cur{font-size:.8em;font-weight:600;color:var(--ink-2);margin-right:1px}
.amt .dec{font-size:.74em;font-weight:600;color:var(--ink-2)}
.amt small{font-weight:400;font-size:12px;letter-spacing:0;color:var(--muted);margin-left:2px}
.chg{display:block;font-family:var(--fm);font-size:12.5px;font-weight:600;white-space:nowrap;margin-top:3px}
.chg.up{color:var(--up)}
.chg.down{color:var(--down)}
.chg.flat{color:var(--muted);font-weight:500}
.stale{color:var(--warn)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:1px;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.chip.good{background:var(--down-soft);color:var(--down)}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 4px 8px}
.sec h2{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.sec span{font-size:13px;color:var(--muted)}
.link{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-sm);padding:18px 16px}

/* supplier page header */
.info{padding:2px 4px 0}
.info .meta{font-size:14px;margin:0}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{height:38px;padding:0 15px;border-radius:19px;border:0;background:var(--surface);box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;cursor:pointer;transition:transform .12s}
.pill:active{transform:scale(.95)}
.pill svg{color:var(--accent)}
.memo{margin:12px 0 0;font-size:14px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}

/* fabric price card + chart */
.lbl{font-size:13px;color:var(--muted)}
.big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px;overflow-wrap:anywhere}
.big .cur{font-size:.55em;font-weight:700;color:var(--ink-2);vertical-align:.5em;margin-right:3px}
.big .dec{font-size:.55em;font-weight:700;color:var(--ink-2)}
.big .unit{font-size:15px;font-weight:400;letter-spacing:0;color:var(--muted)}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px;font-size:13.5px;color:var(--muted)}
.pmeta .chg{display:inline;margin:0;font-size:13.5px}
.chart{margin-top:16px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ch-area{fill:var(--accent);fill-opacity:.08}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ch-ext{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:3 5;stroke-opacity:.5}
.ch-base{fill:none;stroke:var(--line);stroke-width:1}
.ch-dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.ch-end{fill:var(--accent)}
.ch-txt{fill:var(--muted);font-family:var(--fm);font-size:11px}
.chart.draw .ch-line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s var(--ease) .1s forwards}
.chart.draw .ch-area,.chart.draw .ch-ext,.chart.draw circle{animation:fade .5s ease .6s backwards}
.hrow{display:flex;align-items:center;gap:8px;padding:12px 4px 12px 16px;border-top:1px solid var(--line);min-height:60px}
.hrow:first-child{border-top:0}
.hrow .main{font-size:15px}
.hrow .icon-btn{opacity:.55}

/* empty states */
.empty{text-align:center;padding:48px 20px 24px;color:var(--muted)}
.empty .ic{width:64px;height:64px;margin:0 auto;border-radius:20px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-sm);color:var(--accent)}
.empty h3{margin:16px 0 6px;color:var(--ink);font-size:18px;font-weight:700;text-wrap:balance}
.empty p{margin:0 auto 20px;max-width:32ch;font-size:14px}
.empty .acts{display:flex;flex-direction:column;align-items:center;gap:6px}
.sk{pointer-events:none}
.sk-l{height:12px;border-radius:6px;width:55%;background:var(--surface-3)}
.sk-l.s{width:30%;margin-top:9px}
</style>
