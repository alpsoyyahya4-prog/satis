<dialog class="sheet" id="sheet" lang="tr" aria-labelledby="sheetTitle">
  <form id="sheetForm" novalidate>
    <span class="grab" aria-hidden="true"></span>
    <header id="sheetHead">
      <h3 id="sheetTitle"></h3>
      <button class="icon-btn" type="button" data-act="close-sheet" aria-label="Kapat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="body" id="sheetBody"></div>
    <footer>
      <button class="btn danger" id="sheetDanger" type="button" hidden></button>
      <button class="btn primary" id="sheetSubmit" type="submit">Kaydet</button>
    </footer>
  </form>
</dialog>

<dialog class="alert" id="confirm" lang="tr" aria-labelledby="confirmTitle">
  <div class="wrap">
    <header><h3 id="confirmTitle"></h3></header>
    <div class="body"><p id="confirmText"></p></div>
    <footer>
      <button class="btn" id="confirmNo" type="button">Vazgeç</button>
      <button class="btn danger" id="confirmYes" type="button">Sil</button>
    </footer>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" popover="manual" hidden></div>
