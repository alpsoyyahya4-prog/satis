<style>
/* buttons */
.btn{height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--surface-3);color:var(--ink);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--up-soft);color:var(--up)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{height:36px;padding:0 13px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background-color .15s}
.icon-btn:active{background:var(--surface-3)}
.icon-btn.sm{width:40px;height:40px;color:var(--muted)}

/* settings */
.group{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden}
.set{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;min-height:56px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit;text-decoration:none;font-size:15px}
.set:first-child{border-top:0}
button.set{cursor:pointer}
button.set:active,label.set:active{background:var(--surface-2)}
.set .tx{flex:1;min-width:0}
.set .t{font-weight:600}
.set .d{font-size:13px;color:var(--muted);margin-top:1px}
.set > svg{flex:none;color:var(--muted);opacity:.7}
.set.col{flex-direction:column;align-items:stretch;gap:10px}
.set input.time{flex:none;width:104px;min-height:42px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:15px;font-weight:600;padding:6px 8px;text-align:center;-webkit-appearance:none;appearance:none}
.set input.time:focus{outline:none;border-color:var(--accent)}
.status{display:flex;align-items:center;gap:12px}
.status .ok{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--down-soft);color:var(--down)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn-row .wide{grid-column:1/-1}
.note-sm{margin:8px 6px 0;font-size:13px;color:var(--muted)}
.segc{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:12px;background:var(--surface-3)}
.segc button{position:relative;z-index:1;height:36px;border:0;border-radius:9px;background:none;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;transition:color .2s}
.segc button[aria-pressed="true"]{color:var(--ink)}
.segc .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));border-radius:9px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15);transform:translateX(calc(var(--k) * 100%));transition:transform .3s var(--ease)}
.tg{position:relative;flex:none;width:50px;height:30px}
.tg input{position:absolute;inset:0;z-index:1;margin:0;opacity:0;cursor:pointer}
.tg span{position:absolute;inset:0;border-radius:15px;background:var(--surface-3);transition:background-color .25s}
.tg span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.tg input:checked + span{background:var(--accent)}
.tg input:checked + span::after{transform:translateX(20px)}
.tg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.about{margin:24px 4px 0;font-size:12.5px;color:var(--muted);text-align:center}

/* tab bar + add button + toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--nav-inset)}
.tabbar nav{max-width:560px;margin:0 auto;height:var(--tabh);display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;transition:color .2s}
.tab .pi{position:relative;width:56px;height:30px;display:grid;place-items:center}
.tab .pi::before{content:"";position:absolute;inset:0;border-radius:15px;background:var(--accent-soft);opacity:0;transform:scaleX(.5);transition:transform .3s var(--ease),opacity .2s}
.tab .pi svg{position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .pi{color:var(--accent)}
.tab[aria-current="page"] .pi::before{opacity:1;transform:none}
.fab{position:fixed;z-index:31;right:max(16px,calc(50vw - 264px));bottom:calc(var(--tabh) + var(--nav-inset) + 16px);height:52px;min-width:52px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;transition:padding .25s var(--ease),transform .12s;animation:fabIn .3s var(--ease) backwards}
.fab span{margin-left:8px;max-width:160px;overflow:hidden;white-space:nowrap;transition:max-width .25s var(--ease),margin .25s var(--ease),opacity .2s}
.fab.mini{padding:0 14px}
.fab.mini span{max-width:0;margin-left:0;opacity:0}
.fab:active{transform:scale(.95)}
.toast{position:fixed;z-index:60;inset:auto;left:50%;bottom:calc(var(--tabh) + var(--nav-inset) + 84px);margin:0;border:0;display:flex;align-items:center;gap:8px;width:max-content;max-width:calc(100% - 32px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;line-height:1.35;box-shadow:var(--shadow);transform:translateX(-50%);animation:toastIn .25s var(--ease) both}
.toast svg{flex:none}
.toast .t-act{margin-left:6px;padding:4px 2px;border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.toast[popover]:not(:popover-open){display:none}

/* bottom sheets & alert */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink);overscroll-behavior:contain}
dialog::backdrop{background:rgba(8,10,20,.45)}
dialog.sheet[open]{animation:sheetUp .32s var(--ease) backwards}
dialog[open]::backdrop{animation:fade .25s ease both}
dialog.closing{animation:sheetDown .2s ease-in both}
dialog.closing::backdrop{animation:fadeOut .2s ease both}
dialog.alert{border:0;padding:0;margin:auto;width:min(calc(100% - 40px),380px);border-radius:20px;background:var(--surface);color:var(--ink)}
dialog.alert[open]{animation:popIn .22s var(--ease) both}
dialog.alert.closing{animation:popOut .15s ease-in both}
.sheet form,.sheet .wrap,.alert .wrap{display:flex;flex-direction:column;max-height:92vh;max-height:92dvh}
.grab{flex:none;display:block;width:40px;height:5px;margin:10px auto 0;border-radius:3px;background:var(--surface-3)}
.sheet header,.alert header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 2px 20px;touch-action:none}
.sheet header h3,.alert header h3{margin:0;font-size:19px;font-weight:700;overflow-wrap:anywhere}
.alert header{padding:22px 20px 0}
.sheet .body,.alert .body{overflow:auto;padding:12px 20px 18px;display:flex;flex-direction:column;gap:16px}
.alert .body p{margin:0;color:var(--ink-2)}
.sheet footer,.alert footer{display:flex;gap:10px;padding:12px 20px calc(14px + var(--nav-inset));border-top:1px solid var(--line)}
.alert footer{border-top:0;padding-bottom:18px}
.sheet footer .btn,.alert footer .btn{flex:1;height:50px}
.fld{border:0;margin:0;padding:0;min-width:0}
.fld > label,.fld legend{display:block;padding:0;margin-bottom:6px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.fld input,.fld textarea,.fld select{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:11px 14px;-webkit-appearance:none;appearance:none;transition:border-color .2s}
.fld input[type="date"]{min-width:0}
.fld input[inputmode="decimal"]{font-family:var(--fm);font-weight:600;font-size:20px}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.fld .hint{margin-top:6px;font-size:13px;color:var(--muted)}
.fld .err{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--up)}
.fld.bad input,.fld.bad select{border-color:var(--up)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;width:1px;height:1px}
.opts span{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:40px;padding:0 13px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;font-size:14px;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
.opts input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
details.more{border-top:1px solid var(--line);padding-top:4px}
details.more summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 0;color:var(--accent);font-weight:600;font-size:14.5px}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{transition:transform .2s}
details.more[open] summary svg{transform:rotate(90deg)}
details.more .inner{display:flex;flex-direction:column;gap:16px;padding-top:8px}

/* launch screen: the Satış mark draws in, then lifts away */
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#073B44 0%,#0F766E 100%);color:#fff;overflow:hidden;animation:spOut .38s ease-in 1.25s forwards}
#splash::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 42%,rgba(233,176,78,.24),transparent 34%);animation:spGlow 2.2s ease-in-out infinite alternate}
#splash .sp-mark{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;filter:drop-shadow(0 16px 28px rgba(0,0,0,.2));animation:spMarkIn .75s cubic-bezier(.3,1.2,.5,1) both}
#splash .sp-card{fill:#F7F4EA}
#splash .sp-s{fill:none;stroke:#0B4650;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .65s ease .18s forwards}
#splash .sp-arrow{fill:none;stroke:#E9B04E;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease .42s forwards}
#splash .sp-name{position:absolute;left:0;right:0;top:calc(50% + 88px);text-align:center;font-weight:800;font-size:30px;letter-spacing:-.01em;animation:spRise .45s var(--ease) .46s both}
@keyframes spMarkIn{0%{opacity:0;transform:scale(.72) rotate(-8deg)}65%{opacity:1;transform:scale(1.04) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes spGlow{from{opacity:.55;transform:scale(.9)}to{opacity:1;transform:scale(1.08)}}
@keyframes spRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;transform:scale(1.05);visibility:hidden}}
/* motion: calm page and sheet transitions only */
#view.a-fwd{animation:inFwd .26s var(--ease) backwards}
#view.a-back{animation:inBack .26s var(--ease) backwards}
#view.a-tab{animation:fade .22s ease backwards}
@keyframes inFwd{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:translateY(var(--drag,0px))}to{transform:translateY(100%)}}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.97)}}
@keyframes fabIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes draw{to{stroke-dashoffset:0}}
html.no-anim *,html.no-anim *::before,html.no-anim *::after,html.no-anim ::backdrop{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after,::backdrop{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
